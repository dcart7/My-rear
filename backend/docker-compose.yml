services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: miytil
      POSTGRES_USER: miytil
      POSTGRES_PASSWORD: miytil_dev_password
    ports:
      - "5432:5432"
    volumes:
      - miytil_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miytil -d miytil"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: postgres://miytil:miytil_dev_password@postgres:5432/miytil
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-long-random-secret}
      PORT: 8787
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      ALERTS_IN_UA_TOKEN: ${ALERTS_IN_UA_TOKEN:-}
    ports:
      - "8787:8787"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  miytil_pgdata:
