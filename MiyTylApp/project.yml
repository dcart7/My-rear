name: MiyTyl
options:
  bundleIdPrefix: ua.miytyl
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.10
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  MiyTyl:
    type: application
    platform: iOS
    sources:
      - path: MiyTyl
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ua.miytyl.app
        INFOPLIST_FILE: MiyTyl/Info.plist
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
    scheme:
      gatherCoverageData: false
    dependencies:
      - target: MiyTylLiveActivity
  MiyTylLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: MiyTylLiveActivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ua.miytyl.app.live-activity
        INFOPLIST_FILE: MiyTylLiveActivity/Info.plist
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
